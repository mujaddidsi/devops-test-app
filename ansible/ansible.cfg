[defaults]
# Inventory location
inventory = inventory.ini

# Default SSH user for EC2 Ubuntu instances
remote_user = ubuntu

# Path to SSH private key
private_key_file = ~/.ssh/test-server-key.pem

# Disable host key checking for automated runs
# NOTE: Set to True in production for stricter security
host_key_checking = False

# Connection timeout in seconds
timeout = 30

# Disable retry files to keep working directory clean
retry_files_enabled = False

# Use Python 3 on remote hosts
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# Speed up connections with SSH multiplexing
pipelining = True